 .shell .stage{height:calc(100dvh - var(--pad) - 10px - 50px)!important;padding:clamp(10px,1vw,20px)!important}

}

.copy{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 var(--pad) 14px;text-align:left}

.shell.collapsed .side.frost{padding:14px 0 18px!important}
html[data-theme="light"] .shell .side.frost{background:linear-gradient(165deg,rgba(255,255,255,.96) 0%,rgba(236,242,250,.94) 50%,rgba(219,229,243,.92) 100%)!important;border:1px solid rgba(11,42,99,.10)!important;box-shadow:0 20px 50px rgba(11,42,99,.12)!important}

<script>
(()=>{const sh=document.getElementById('shell'),b=document.getElementById('collapseBtn');if(!sh||!b)return;
 const set=c=>{sh.classList.toggle('collapsed',c);b.setAttribute('aria-expanded',String(!c));b.setAttribute('aria-label',c?'Expand side panel':'Collapse side panel');try{localStorage.setItem('eicf-side-collapsed',c?'1':'0')}catch(e){}};
 let init=false;try{init=localStorage.getItem('eicf-side-collapsed')==='1'}catch(e){}
 sh.style.transition='none';set(init);requestAnimationFrame(()=>sh.style.transition='');
 let manual=false;b.addEventListener('click',()=>{const c=!sh.classList.contains('collapsed');set(c);if(!c)manual=true;});const auto=()=>{if(!manual&&!sh.classList.contains('collapsed')&&innerWidth>960)set(true);};let lp=null;document.addEventListener('pointermove',e=>{lp=[e.clientX,e.clientY];},{passive:true});const st=sh.querySelector('.stage');const overChatFn=()=>{if(!lp||!st)return false;const r=st.getBoundingClientRect();return lp[0]>=r.left-40&&lp[0]<=r.right+40&&lp[1]>=r.top-40&&lp[1]<=r.bottom+40;};const chk=()=>{const a=document.activeElement;if(overChatFn()&&a&&a.tagName==='IFRAME'&&sh.contains(a))auto();};addEventListener('blur',()=>setTimeout(chk,0));let prevA=null;const t0=Date.now();setInterval(()=>{const a=document.activeElement;if(a&&a.tagName==='IFRAME'&&!overChatFn()&&Date.now()-t0<8000){a.blur();try{window.focus()}catch(e){}prevA=document.activeElement;return;}if(a!==prevA){prevA=a;chk();}},300);document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('.chat'))auto();});})();
</script><script>
(()=>{const r=document.documentElement,b=document.getElementById('themeToggle');
 const set=t=>{r.dataset.theme=t;b.setAttribute('aria-label',t==='light'?'Switch to dark mode':'Switch to light mode');try{localStorage.setItem('eicf-theme',t)}catch(e){}};
 set(r.dataset.theme||'dark');
 b.addEventListener('click',()=>set(r.dataset.theme==='light'?'dark':'light'));})();
</script><p class="copy"><span>© 2026 Emory University</span><button class="altview" id="altView" type="button">Chat not loading? Try the simple view</button></p><script>
(()=>{const f=document.getElementById('botFrame'),btn=document.getElementById('altView');if(!f||!btn)return;
 const FULL='https://www.chatbase.co/zDt_jEphc3lenROqsPX3S/help',SIMPLE='https://www.chatbase.co/chatbot-iframe/zDt_jEphc3lenROqsPX3S';

 const use=s=>{simple=s;f.src=s?SIMPLE:FULL;btn.textContent=s?'Switch back to the full chat view':'Chat not loading? Try the simple view';try{localStorage.setItem('eicf-chat-view',s?'simple':'full')}catch(e){}};
 if(simple)use(true);
 let loaded=false;f.addEventListener('load',()=>{loaded=true;});
 setTimeout(()=>{if(!loaded&&!simple)use(true);},15000);
 btn.addEventListener('click',()=>use(!simple));})();
</script>

<script>
const CORES=[["BCC", "Biostatistics Collaboration Core"], ["CSIC", "Center for Systems Imaging Core"], ["DAR", "Division of Animal Resources"], ["EGMIC", "Glycomics and Molecular Interactions Core"], ["EFCC", "Flow Cytometry Core"], ["EHCF", "High Containment Facility"], ["EIBC", "Integrated Biorepository Core"], ["EGAC", "Gnotobiotic Animal Core"], ["EICC", "Integrated Computational Core"], ["EIGC", "Integrated Genomics Core"], ["EIMLC", "Metabolomics and Lipidomics Core"], ["EIPC", "Integrated Proteomics Core"], ["EMIC", "Multiplexed Immunoassay Core"], ["ESCOC", "Stem Cell and Organoids Core"], ["HPLC", "HPLC Bioanalytical Core"], ["ICI", "Integrated Cellular Imaging Core"], ["IDS", "Investigational Drug Service"], ["TMF", "Mouse Transgenic and Gene Targeting Core"], ["IEMC", "Integrated Electron Microscopy Core"], ["RBC", "Rodent Behavioral Core"], ["AI2EC", "AI Image Extraction and De-Identification Core"]];
const wall=document.getElementById('wall'),tip=document.getElementById('tip'),toast=document.getElementById('toast');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function build(){
  const rows=Math.ceil(innerHeight/37)+1, per=Math.ceil(innerWidth/70)+3; let h='';
  for(let r=0;r<rows;r++){let row='<div class="row">';
    for(let k=0;k<per;k++){const c=CORES[(r*7+k)%CORES.length];const rnd=Math.random();
      row+='<span data-i="'+((r*7+k)%CORES.length)+'"'+(rnd<.04?' class="g"':rnd<.08?' class="b"':'')+'>'+c[0]+'</span>';}
    h+=row+'</div>';}
  wall.innerHTML=h;
}
build(); let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(build,200)});
if(!RM) setInterval(()=>{const s=wall.querySelectorAll('span');if(!s.length)return;
  const el=s[Math.floor(Math.random()*s.length)];const c=Math.random()<.5?'g':'b';
  el.classList.add(c,'tw');setTimeout(()=>el.classList.remove(c,'tw'),3600+Math.random()*3000);},520);
addEventListener('pointermove',e=>{document.documentElement.style.setProperty('--mx',e.clientX+'px');document.documentElement.style.setProperty('--my',e.clientY+'px');
  const t=e.target.closest&&e.target.closest('#wall span');
  if(t){const c=CORES[+t.dataset.i];tip.innerHTML=c[1]+'<small>Click to copy a question about '+c[0]+'</small>';
    tip.style.left=Math.min(e.clientX+14,innerWidth-280)+'px';tip.style.top=(e.clientY+18)+'px';tip.classList.add('on');}
  else tip.classList.remove('on');});
wall.addEventListener('click',async e=>{const t=e.target.closest('span');if(!t)return;const c=CORES[+t.dataset.i];
  const q='What does the '+c[1]+' ('+c[0]+') offer, and how do I get started?';
  try{await navigator.clipboard.writeText(q);toast.textContent='Question copied. Paste it into the chat.';}catch(_){toast.textContent=q;}
  toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),2600);
  t.classList.add('g','tw');setTimeout(()=>t.classList.remove('g','tw'),1500);});
</script>
